name: Python compatibility tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14.4", "3.14", "3.11", "3.10"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip & tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (if any)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            # Try editable install if package metadata exists; ignore failure
            pip install . || true
          fi

      - name: Check Python version
        run: python --version

      - name: Syntax check (compile all .py files)
        run: python -m compileall -q .

      - name: Run test suite (if present)
        run: |
          if command -v pytest >/dev/null 2>&1 || [ -d tests ] || [ -f pytest.ini ]; then
            pytest -q
          else
            echo "No pytest tests detected; skipping."
          fi
